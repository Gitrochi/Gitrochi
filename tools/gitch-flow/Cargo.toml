[package]
name = "gitch-flow"
version = "0.3.12"
edition = "2021"
# No license identifier until the Community Use proposal is adopted; the scope follows the root LICENSE and the combined notices.
description = "Composable test and CI flow engine for gitch and Gitrochi"
publish = false

[lib]
name = "gitch_flow"
path = "src/lib.rs"

[[bin]]
name = "gitch-flow"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
yaml-rust2 = "0.10"
sha2 = "0.10"
roxmltree = "0.20"
regex = "1"
ureq = "2"
url = "2"
getrandom = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
