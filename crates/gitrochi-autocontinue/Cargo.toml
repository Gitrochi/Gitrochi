[package]
name = "gitrochi-autocontinue"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
# No license identifier until the Community Use proposal is adopted; see THIRD_PARTY_NOTICES.md.
description = "Decides when Gitrochi may answer an agent's unanswered question or permission request, and what it sends"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "gitrochi-autocontinue"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
