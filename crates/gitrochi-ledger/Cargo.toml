[package]
name = "gitrochi-ledger"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
# No license identifier until the Community Use proposal is adopted; see THIRD_PARTY_NOTICES.md.
description = "Session ledger shared by the Gitrochi apps, the gitrochi-ledger CLI and its MCP server"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "gitrochi-ledger"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite is compiled in (bundled, the index's version) so every platform gets the same one.
# The standard library has no Unicode normalisation; version patterns are regular expressions.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
unicode-normalization = "0.1"
regex-lite = "0.1"
