[package]
name = "gitrochi-terminal"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
# No license identifier until the Community Use proposal is adopted; see THIRD_PARTY_NOTICES.md.
description = "Terminal host that keeps the Gitrochi apps' shells and agents running after the app quits"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "gitrochi-terminal-host"
path = "src/main.rs"

# Nothing here builds for the WebAssembly core; the workspace's wasm build compiles an empty library.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"
interprocess = "2.4.9"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
