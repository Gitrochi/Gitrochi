[package]
name = "gitrochi-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "gitch-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.12"

