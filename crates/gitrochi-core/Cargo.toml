[package]
name = "gitrochi-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "gitch-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.12"

# The native static library also carries the repository index (SQLite + the C++
# tokenizer) and the session ledger, so the macOS app links a single Rust runtime.
# WebAssembly builds leave them out.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gitrochi-index = { path = "../gitrochi-index" }
gitrochi-ledger = { path = "../gitrochi-ledger" }
