[package]
name = "gitrochi"
version = "0.3.12"
description = "Gitrochi — Git client with a commit graph, worktrees, PRs, Claude Code agents and a terminal"
authors = ["조문성 (ChoMnSeong)", "jjunhaa0211"]
license = "MIT"
edition = "2021"

[lib]
name = "gitrochi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
notify = "6.1"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dirs = "5"
wait-timeout = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
