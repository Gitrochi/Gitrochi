name: 🐞 Bug report
description: Something misbehaves, hangs or renders wrong
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. First check that you are on the [latest release](https://github.com/Gitrochi/Gitrochi/releases/latest) and that there is no [similar issue](https://github.com/Gitrochi/Gitrochi/issues?q=is%3Aissue).
        **Remove or blur tokens, passwords and company repository addresses or names.** Report security problems [privately](https://github.com/Gitrochi/Gitrochi/security/advisories/new), not in an issue.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Both
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Gitrochi version
      description: Settings › Updates (the Updates tab on Windows)
      placeholder: "0.3.12"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and git version
      description: "Include the output of `git --version`. On WSL, the distribution too."
      placeholder: "macOS 15.5 · git 2.47.1 / Windows 11 24H2 · git 2.47.1.windows.1"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you were trying to do, what happened instead, and any error message pasted as it appeared.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository
        2. Drag the branch 'feature/x' onto main
        3. Press 'Rebase' …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Commit graph · branches
        - Stage · commit · diff
        - GitHub · GitLab (PR/MR · accounts)
        - CI/CD
        - AI (commit messages · rules · split commits)
        - Agents · worktrees
        - Terminal
        - Updates · install
        - Performance (slow · hangs)
        - Other

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots and logs
      description: |
        For anything visual, drop a screenshot here. For slowness or odd refreshes,
        on macOS run `GITROCHI_TRACE=1 /Applications/Gitrochi.app/Contents/MacOS/Gitrochi` and paste the terminal output;
        on Windows open the developer tools (F12), set `localStorage.gitrochiTrace = "1"` and paste the console.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: It happens on the latest release
          required: true
        - label: I looked for a similar issue
          required: true
        - label: I removed or blurred tokens, passwords and company details
          required: true
