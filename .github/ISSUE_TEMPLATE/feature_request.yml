name: ✨ Feature request
description: Suggest a new feature or a better way to do something
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Start with **what is awkward today**; that makes it easier to find the best way together.

  - type: textarea
    id: problem
    attributes:
      label: What is awkward today?
      description: How you do it now and what makes it tedious
      placeholder: "Every time I create a PR I have to open the browser …"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: Where (screen, menu), what you press, and what should happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you considered
      description: How other apps do it (GitKraken · Fork · Sourcetree · VS Code …) is welcome too

  - type: checkboxes
    id: platform
    attributes:
      label: Platforms
      options:
        - label: macOS
        - label: Windows

  - type: textarea
    id: extra
    attributes:
      label: References
      description: Drop mock-ups, sketches or screenshots here (blur company details)

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to send a pull request for this ([contributing guide](https://github.com/Gitrochi/Gitrochi/blob/main/CONTRIBUTING.md))
