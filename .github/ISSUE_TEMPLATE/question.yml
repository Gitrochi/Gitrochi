name: 💬 Question · help
description: How something works, or a setup that does not come together
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        The [usage and features](https://github.com/Gitrochi/Gitrochi/blob/main/docs/features.md) document may already have the answer.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and what you have tried
    validations:
      required: true
