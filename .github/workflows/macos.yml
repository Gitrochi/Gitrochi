name: macOS

# PR: 빌드 확인. v* 태그: 유니버설 빌드 → 업데이트 서명 → 그 태그의 릴리스(없으면 초안)에 올리기.
# main 은 PR 로만 바뀌므로(이미 PR 에서 빌드함) 합친 뒤 main 에서 다시 돌리지 않는다.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["crates/**", "tools/build-core*", "macos/**", "tools/gitch/**", "tools/gitrochi-mcp/**", "tools/gitch-swift-index/**", "tools/gitch-flow/**", "tools/check-versions.sh", "windows/package*.json", "windows/src-tauri/Cargo.*", "windows/src-tauri/tauri.conf.json", ".github/workflows/macos.yml"]
  workflow_dispatch:

# 같은 PR 에 새로 푸시하면 돌던 실행은 취소
concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 빌드
    if: github.ref_type != 'tag'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Native sidebar visibility test
        run: bash macos/Tools/test-sidebar-visibility.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Rust 공통 코어 검사
        run: cargo test --locked --manifest-path crates/Cargo.toml

      # To put the flow engine (tools/gitch-flow) into the app
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tools/gitch-flow -> target"

      - name: 빌드
        run: macos/build.sh

      - name: Native window frame regression
        run: bash macos/Tools/test-window-content-layout.sh --output "$RUNNER_TEMP/window-content-layout"

      - name: Window frame failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: window-content-layout
          path: ${{ runner.temp }}/window-content-layout
          if-no-files-found: ignore
          retention-days: 3

      - name: Check the flow engine in the app
        run: |
          app=macos/build/Gitrochi.app/Contents
          "$app/Resources/gitch-flow" version --json
          GITCH_FLOW_NO_KEYSTORE=1 "$app/Resources/gitch" flow version

      - name: 앱 올리기
        uses: actions/upload-artifact@v4
        with:
          name: gitrochi-macos
          path: macos/build/Gitrochi.app

      # gitch graph files 의 Xcode 인덱스 도우미: 앱에 넣은 그 실행 파일로, 예제를 swift build 해 만든 인덱스를 읽어 본다
      - name: 앱 URL 이동 테스트
        run: bash macos/Tools/test-app-route.sh

      - name: Offline graph app language test
        run: bash macos/Tools/test-graph-language.sh

      - name: Git 파서 · 충돌 · 줄 단위 패치 회귀 테스트
        run: bash macos/Tools/test-git-core.sh

      - name: Push 검토 · PR 리뷰 · AI 변경 질문 테스트
        run: |
          bash macos/Tools/test-push-review.sh
          bash macos/Tools/test-pull-request-review.sh
          bash macos/Tools/test-change-question.sh

      - name: 비교 · 협업 · 로컬 복구 도구 테스트
        run: |
          bash macos/Tools/test-history-tools.sh
          bash macos/Tools/test-collaboration.sh
          bash macos/Tools/test-local-workflows.sh
          bash macos/Tools/test-workspace-navigation.sh
          bash macos/Tools/test-inspector-layout.sh
          bash macos/Tools/test-adaptive-workbench-identity.sh
          bash macos/Tools/test-large-changes.sh
          bash macos/Tools/test-repository-browser.sh
          bash macos/Tools/test-workbench-first-screen.sh
          bash macos/Tools/test-hosting-target.sh
          bash macos/Tools/test-hosting-hub.sh
          bash macos/Tools/test-hosting-hub-credentials.sh
          bash macos/Tools/test-project-workbench.sh
          bash macos/Tools/test-project-schedule.sh
          bash macos/Tools/test-project-scheduling.sh
          bash macos/Tools/test-project-portfolio.sh
          bash macos/Tools/test-local-projects.sh
          bash macos/Tools/test-project-management.sh
          bash macos/Tools/test-project-creation-recovery.sh
          bash macos/Tools/test-project-backend.sh
          bash macos/Tools/test-project-task-creation.sh
          bash macos/Tools/test-workspace-operations.sh
          bash macos/Tools/test-confirmation-guard.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 읽기 전용 MCP 계약 테스트
        run: node --test tools/gitrochi-mcp/server.test.mjs

      # The engine JSON the Flows screen reads (with the engine in the app): list, plan, detached run, events, records, init, gate, errors
      - name: Flows screen contract test
        run: bash macos/Tools/test-flow.sh

      - name: Keychain 저장 · 갱신 · 삭제 테스트
        run: |
          bash macos/Tools/test-keychain.sh
          bash macos/Tools/test-credential-access.sh
          bash macos/Tools/test-saved-account-verification.sh

      - name: GitHub 공개키 등록 계약 테스트
        run: bash macos/Tools/test-github-key-registration.sh

      - name: GitHub 로그인 계정 일치 테스트
        run: |
          bash macos/Tools/test-github-login-identity.sh
          bash macos/Tools/test-browser-login-progress.sh

      - name: gitch-swift-index 테스트
        run: tools/gitch-swift-index/tests/run.sh macos/build/Gitrochi.app/Contents/Resources/gitch-swift-index

  # gitch(앱에 함께 들어가는 셸 도구): macOS 기본 bash 3.2 로 전체 테스트(임시 HOME · 가짜 ssh/gh/curl/원격)
  gitch:
    name: gitch 테스트
    if: github.ref_type != 'tag'
    runs-on: macos-26
    # The shell suite and native-helper regression run sequentially on hosted runners.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: JSON 계약 검증 준비
        run: |
          python -m pip install jsonschema==4.25.1
          printf 'GITCH_JSONSCHEMA_PYTHON=%s\n' "$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      # gitch graph 의 svg · png(graphviz dot)도 시험하려고 — dot 이 없으면 그 시험은 설치 안내 경로만 본다
      - name: graphviz
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: command -v dot >/dev/null || brew install graphviz

      - name: 테스트
        run: tools/gitch/tests/run.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust CLI 가속 경로 테스트
        run: |
          cargo build --locked --release --manifest-path crates/Cargo.toml --bin gitch-core
          GITCH_CORE="$GITHUB_WORKSPACE/crates/target/release/gitch-core" bash tools/gitch/tests/run.sh -k graph

      - name: 정밀 참조 · 자동 갱신 테스트
        run: |
          python tools/gitch/tests/test_scip.py
          python tools/gitch/tests/test_watch.py

      # 정적 검사(경고 이상) — 로컬과 같은 최신 shellcheck. 테스트가 실패해도 따로 결과를 보인다
      - name: shellcheck
        if: ${{ !cancelled() }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck --version | sed -n 2p
          shellcheck -S warning tools/check-versions.sh tools/gitch/gitch tools/gitch/install.sh tools/gitch/tests/*.sh tools/gitch-swift-index/build.sh tools/gitch-swift-index/tests/run.sh tools/gitch-flow/build.sh

  # 릴리스에 파일을 올려야 해서 쓰기 권한은 태그 실행에만 준다.
  # 앱의 업데이트 확인은 초안을 보지 않으므로, 관리자가 노트를 쓰고 '게시'해야 사용자에게 간다.
  release:
    name: 배포 파일
    if: github.ref_type == 'tag'
    environment: release
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
    # Windows(windows.yml 「릴리스에 올리기」)와 같은 그룹으로 하나씩 돈다: 같은 태그의 초안이 둘 생기지 않게
    concurrency:
      group: release-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 태그와 앱 버전 맞추기
        run: |
          app="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' macos/Resources/Info.plist)"
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 Info.plist 버전 $app 이 다릅니다. 버전을 올린 커밋에 태그를 다세요."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: 배포 파일 (유니버설 · 업데이트 서명)
        env:
          GITROCHI_UPDATE_KEY: ${{ secrets.GITROCHI_UPDATE_KEY }}
        run: macos/build.sh release

      # 앱 없이 gitch 만 쓰는 사람용: tools/gitch/install.sh 와 gitch self-update 가 받는다(아래에서 다른 배포 파일과 함께 올림)
      - name: gitch (CLI 만)
        run: |
          for file in gitch gitch-scip-index gitch-graph-watch; do
            cp "tools/gitch/$file" "macos/dist/$file"
            (cd macos/dist && shasum -a 256 "$file" > "$file.sha256")
          done
          # The flow engine (the same universal binary as in the app)
          cp macos/build/Gitrochi.app/Contents/MacOS/gitch-flow macos/dist/gitch-flow-macos
          (cd macos/dist && shasum -a 256 gitch-flow-macos > gitch-flow-macos.sha256)
          cp tools/gitch-flow/THIRD_PARTY_NOTICES.txt macos/dist/gitch-flow-THIRD-PARTY-NOTICES.txt
          (cd macos/dist && shasum -a 256 gitch-flow-THIRD-PARTY-NOTICES.txt > gitch-flow-THIRD-PARTY-NOTICES.txt.sha256)

      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --verify-tag --title "Gitrochi ${tag#v}" --notes ""
          gh release upload "$tag" macos/dist/* --clobber
          {
            echo "### 맥 배포 파일 → $tag"
            echo '```'
            cat macos/dist/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 배포 파일 올리기
        uses: actions/upload-artifact@v4
        with:
          name: gitrochi-macos-release
          path: macos/dist/*
