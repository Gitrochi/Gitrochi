name: Windows

# PR: 타입 검사·단위 테스트 → 점검용 빌드 한 번 → 실제 앱 자동 점검.
# 배포(v* 태그)·수동 실행: 위에 더해 서명한 배포 파일(설치 파일·포터블 zip·latest.json), 자동 업데이트 서명 점검, README 스크린샷.
# v* 태그는 점검까지 통과하면 배포 파일을 그 태그의 릴리스(없으면 초안)에 올린다.
# main 은 PR 로만 바뀌므로(이미 PR 에서 점검함) 합친 뒤 main 에서 다시 돌리지 않는다.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["windows/**", "tools/gitch/**", "tools/check-versions.sh", "macos/Resources/Info.plist", "docs/make-demo-repo.sh", ".github/workflows/windows.yml"]
  workflow_dispatch:

# 같은 PR 에 새로 푸시하면 돌던 실행은 취소한다(겹쳐 돌며 줄 서지 않게)
concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 빌드 · 자동 점검
    # Signing keys live in the release environment (v* tags and main only); PR runs build without them
    environment: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && 'release' || '' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FULL: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: 앱 · CLI 버전 일치 확인
        shell: bash
        run: bash ../tools/check-versions.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "windows/src-tauri -> target"

      - name: 패키지 설치
        run: npm ci

      - name: 타입 검사 · 단위 테스트
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: Git 훅 시험 (Git Bash)
        shell: bash
        run: sh ../.githooks/test-rules.sh

      - name: 배포용 빌드 (설치 파일 + 업데이트 서명)
        if: env.FULL == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          else
            # 서명 열쇠가 없는 곳(포크 PR 등)에서는 업데이트 파일 없이 빌드
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      # 점검용 빌드가 target/release/gitrochi.exe 를 0.0.1 로 덮어쓰기 전에 만든다
      - name: 배포 파일 (포터블 zip · sha256 · latest.json)
        if: env.FULL == 'true'
        shell: bash
        run: |
          ver="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 tauri.conf.json 버전 $ver 이 다릅니다. 버전을 올린 커밋에 태그를 다세요."
            exit 1
          fi
          nsis=src-tauri/target/release/bundle/nsis
          setup="Gitrochi_${ver}_x64-setup.exe"
          zip="Gitrochi_${ver}_x64_portable.zip"
          out="$(cygpath -m "$RUNNER_TEMP")/release"
          stage="$(cygpath -m "$RUNNER_TEMP")/portable"
          mkdir -p "$out" "$stage"
          cp "$nsis/$setup" "$out/"
          cp src-tauri/target/release/gitrochi.exe "$stage/Gitrochi.exe"
          cp ../LICENSE "$stage/LICENSE.txt"
          cp ../THIRD_PARTY_NOTICES.md "$stage/THIRD_PARTY_NOTICES.md"
          # 앱이 쓰는 gitch(설치본은 tauri.conf.json 의 resources 로 같은 자리에 들어간다)
          for file in gitch gitch-scip-index gitch-graph-watch; do
            cp "../tools/gitch/$file" "$stage/$file"
            cp "../tools/gitch/$file" "$out/$file"
            (cd "$out" && sha256sum "$file" | sed 's/ \*/  /' > "$file.sha256")
          done
          (cd "$stage" && 7z a -tzip "$out/$zip" Gitrochi.exe LICENSE.txt THIRD_PARTY_NOTICES.md gitch gitch-scip-index gitch-graph-watch >/dev/null)
          # Git Bash 의 sha256sum 이 이름 앞에 붙이는 *(바이너리 표시)는 빼서 맥과 같은 「해시  이름」으로
          (cd "$out" && sha256sum "$setup" "$zip" | sed 's/ \*/  /' > "Gitrochi_${ver}_windows.sha256")
          if [ -f "$nsis/$setup.sig" ]; then
            cp "$nsis/$setup.sig" "$out/"
            # notes 는 비워서 만든다 — 관리자가 게시하기 전에 넣는다(CONTRIBUTING.md 「릴리스」)
            node scripts/latest-json.mjs "$ver" "$setup" "$nsis/$setup.sig" > "$out/latest.json"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::업데이트 서명($setup.sig)이 없습니다. release 환경의 TAURI_SIGNING_PRIVATE_KEY 를 확인하세요."
            exit 1
          fi
          ls -l "$out"

      - name: Branchwork 0.3.5 설치에서 이어받기
        if: env.FULL == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Install 0.3.5 (still named Branchwork), then this installer: only Gitrochi should remain
          $dir = Join-Path $env:RUNNER_TEMP "legacy"
          gh release download v0.3.5 -R "${{ github.repository }}" -p "*x64-setup.exe" -D $dir
          Start-Process (Get-ChildItem "$dir/*-setup.exe")[0].FullName -ArgumentList "/S" -Wait
          $uninst = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall"
          if (-not (Test-Path "$uninst\Branchwork")) { Write-Error "0.3.5 was not installed"; exit 1 }
          $oldDir = (Get-ItemProperty "$uninst\Branchwork").InstallLocation.Trim('"')
          Start-Process (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe")[0].FullName -ArgumentList "/S" -Wait
          $programs = [Environment]::GetFolderPath('Programs')
          $new = if (Test-Path "$uninst\Gitrochi") { Get-ItemProperty "$uninst\Gitrochi" } else { $null }
          $checks = [ordered]@{
            "Branchwork uninstall entry removed" = -not (Test-Path "$uninst\Branchwork")
            "old install folder removed"         = -not (Test-Path $oldDir)
            "Gitrochi installed"                 = $new -and (Test-Path (Join-Path $new.InstallLocation.Trim('"') $new.MainBinaryName))
            "Start menu has Gitrochi only"       = [bool](Get-ChildItem $programs -Recurse -Filter "Gitrochi.lnk") -and -not (Get-ChildItem $programs -Recurse -Filter "Branchwork.lnk")
          }
          $checks.GetEnumerator() | ForEach-Object { Write-Host "$(if ($_.Value) { 'OK  ' } else { 'FAIL' }) $($_.Key)" }
          if ($checks.Values -contains $false) { Write-Error "Upgrade from Branchwork 0.3.5 failed"; exit 1 }

      - name: 배포 파일 올리기
        if: env.FULL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gitrochi-windows
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

      - name: 점검용 빌드(업데이트 서버 http 허용 — 배포 파일과는 별개)
        shell: bash
        run: |
          # 가짜 업데이트 서버(http://127.0.0.1)로 서명 확인을 시험하려고 http 허용 + 낮은 버전(0.0.1)으로 빌드한다.
          # 배포 파일(위에서 올린 설치 파일)은 https 만 쓴다. 배포용 빌드가 없으면(보통 푸시) 업데이트 점검은 건너뛴다.
          npx tauri build --no-bundle --config '{"version":"0.0.1","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"dangerousInsecureTransportProtocol":true}}}'

      - name: 테스트 저장소 만들기
        shell: bash
        run: |
          ROOT="$(cygpath -m "$RUNNER_TEMP")/st"
          bash tests/make-test-repo.sh "$ROOT/repo"
          echo "ST_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: WSL 준비(Ubuntu)
        id: wsl
        continue-on-error: true
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 1

      - name: WSL 에 가짜 claude 두기
        if: steps.wsl.outcome == 'success'
        continue-on-error: true
        shell: wsl-bash {0}
        run: |
          # 윈도에서 받은 파일이라 줄 끝(CR)을 지우고 둔다.
          # PATH 에는 없고 alias 로만 잡혀 있는 설치(예전 Claude Code 'local' 설치)를 흉내 낸다 — 찾기가 이런 경우도 찾아야 한다
          mkdir -p ~/.claude/local
          tr -d '\r' < tests/fake-claude.sh > ~/.claude/local/claude
          chmod 755 ~/.claude/local/claude
          echo 'alias claude="~/.claude/local/claude"' >> ~/.bashrc
          ~/.claude/local/claude --version

      - name: WSL 첫 실행 설정(계정 만들기 화면) 건너뛰기
        if: steps.wsl.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          # 막 설치한 배포판은 처음 열 때 사용자 계정을 만들라고 묻는다(사용자 PC 에서는 이미 끝난 단계) — root 로 바로 열리게
          Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Lxss | ForEach-Object {
            Set-ItemProperty -Path $_.PSPath -Name RunOOBE -Value 0 -Type DWord -ErrorAction SilentlyContinue
            Set-ItemProperty -Path $_.PSPath -Name DefaultUid -Value 0 -Type DWord -ErrorAction SilentlyContinue
          }
          wsl.exe --terminate Ubuntu-24.04 2>$null
          wsl.exe -d Ubuntu-24.04 --cd / -- echo ready

      - name: 자동 점검 (실제 앱 실행)
        shell: pwsh
        run: |
          # AI 연결·자동 업데이트 점검용 가짜 서버(배포용 빌드가 있으면 그 설치 파일과 서명을 업데이트로 내놓는다)
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $mockArgs = @("tests/mock-ai-server.mjs", "18080")
          if (Test-Path "$($setup.FullName).sig") { $mockArgs += @("`"$($setup.FullName)`"", "`"$($setup.FullName).sig`"") }
          $mock = Start-Process -FilePath node -ArgumentList $mockArgs -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "해상도 변경 불가: $_" }
          $exe = Resolve-Path "src-tauri/target/release/gitrochi.exe"
          $result = "$env:ST_ROOT/selftest-result.json"
          $env:GITROCHI_SELFTEST = "$env:ST_ROOT/repo"
          $p = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(240)
          while (-not (Test-Path $result) -and (Get-Date) -lt $deadline -and -not $p.HasExited) { Start-Sleep -Milliseconds 500 }
          Start-Sleep -Seconds 3
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:ST_ROOT/selftest.png")
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $mock.HasExited) { Stop-Process -Id $mock.Id -Force }
          if (-not (Test-Path $result)) { Write-Error "자동 점검 결과가 없습니다(앱이 시작하지 못했거나 멈춤)"; exit 1 }
          $r = Get-Content $result -Raw -Encoding utf8 | ConvertFrom-Json
          foreach ($c in $r.checks) { $mark = if ($c.ok) { "OK  " } else { "FAIL" }; Write-Host "$mark $($c.name) $(if (-not $c.ok) { $c.detail })" }
          if (-not $r.ok) { Write-Error "자동 점검 실패"; exit 1 }

      - name: README 스크린샷용 데모 저장소
        if: env.FULL == 'true'
        shell: bash
        run: bash ../docs/make-demo-repo.sh "$ST_ROOT/demo"

      - name: README 스크린샷 (라이트·다크)
        if: env.FULL == 'true'
        shell: pwsh
        run: |
          # 점검이 끝난 실제 앱을 데모 저장소로 다시 열어 창만 찍는다(docs/images/windows-*.png 로 쓰려고)
          $repo = (Resolve-Path "$env:ST_ROOT/demo/shop-web").Path -replace '\\', '/'
          $exe = Resolve-Path "src-tauri/target/release/gitrochi.exe"
          $data = Join-Path $env:APPDATA "Gitrochi"
          New-Item -ItemType Directory -Force $data, "$env:ST_ROOT/shots" | Out-Null
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Win {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            delegate bool EnumProc(IntPtr h, IntPtr p);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc f, IntPtr p);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int cmd);
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr h, IntPtr after, int x, int y, int w, int hh, uint flags);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr h, int attr, out RECT r, int size);
            // 그 프로세스의 보이는 최상위 창 중 가장 큰 것(Process.MainWindowHandle 은 숨은 도우미 창을 주기도 한다)
            public static IntPtr Find(uint pid) {
              IntPtr best = IntPtr.Zero; long area = 0;
              EnumWindows((h, p) => {
                uint owner; GetWindowThreadProcessId(h, out owner);
                RECT r;
                if (owner == pid && IsWindowVisible(h) && GetWindowRect(h, out r)) {
                  long a = (long)(r.R - r.L) * (r.B - r.T);
                  if (a > area) { area = a; best = h; }
                }
                return true;
              }, IntPtr.Zero);
              return best;
            }
          }
          "@
          foreach ($theme in @("light", "dark")) {
            $settings = @{ openTabs = @($repo); selectedTab = $repo; theme = $theme; language = "ko"; autoUpdate = $false; sidebarMode = "list" } | ConvertTo-Json
            [IO.File]::WriteAllText((Join-Path $data "settings.json"), $settings)
            $p = Start-Process -FilePath $exe -PassThru
            $deadline = (Get-Date).AddSeconds(60)
            $h = [IntPtr]::Zero
            while ($h -eq [IntPtr]::Zero -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 300; $h = [Win]::Find([uint32]$p.Id) }
            Start-Sleep -Seconds 6
            $h = [Win]::Find([uint32]$p.Id)
            [Win]::ShowWindow($h, 9) | Out-Null   # SW_RESTORE(최대화 풀기)
            # 맨 위(HWND_TOPMOST)에 1440x900 으로 — 다른 창(콘솔 등)이 가리지 않게
            [Win]::SetWindowPos($h, [IntPtr](-1), 40, 40, 1440, 900, 0x40) | Out-Null
            [Win]::SetForegroundWindow($h) | Out-Null
            Start-Sleep -Seconds 2
            # 창 테두리 그림자를 빼고 보이는 창 영역만(DWMWA_EXTENDED_FRAME_BOUNDS)
            $r = New-Object Win+RECT
            [Win]::DwmGetWindowAttribute($h, 9, [ref]$r, 16) | Out-Null
            $bmp = New-Object System.Drawing.Bitmap ($r.R - $r.L), ($r.B - $r.T)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.L, $r.T, 0, 0, $bmp.Size)
            $bmp.Save("$env:ST_ROOT/shots/windows-$theme.png")
            Write-Host "windows-$theme.png: $($r.L),$($r.T) $($r.R - $r.L)x$($r.B - $r.T)"
            Stop-Process -Id $p.Id -Force
            Start-Sleep -Seconds 2
          }

      - name: README 스크린샷 올리기
        if: env.FULL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: readme-shots
          path: ${{ env.ST_ROOT }}/shots/*.png
          if-no-files-found: ignore

      - name: 점검 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            ${{ env.ST_ROOT }}/selftest-result.json
            ${{ env.ST_ROOT }}/selftest.png
          if-no-files-found: ignore

  # gitch(설치본에 함께 들어가는 셸 도구): Git Bash 로 전체 테스트(임시 HOME · 가짜 ssh/gh/curl/원격 · 가짜 PowerShell 로 사용자 PATH).
  # Windows 프로세스 실행 비용 때문에 테스트 항목 전체를 4등분해 동시에 검사한다. 태그는 PR에서 확인했으므로 건너뛴다.
  gitch:
    name: gitch 테스트 (Git Bash ${{ matrix.shard }}/4)
    if: github.ref_type != 'tag'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: JSON 계약 검증 준비
        shell: bash
        run: |
          python -m pip install jsonschema==4.25.1
          printf 'GITCH_JSONSCHEMA_PYTHON=%s\n' "$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: 테스트
        shell: bash
        env:
          GITCH_TEST_SHARD: ${{ matrix.shard }}
        run: |
          command -v jq >/dev/null || choco install jq -y --no-progress
          # 공유 fixture를 모두 읽고 테스트 항목을 정확히 한 작업에 배정한다.
          bash tools/gitch/tests/run.sh --shard "$GITCH_TEST_SHARD/4"

      - name: 정밀 참조 · 자동 갱신 테스트
        if: matrix.shard == 1
        shell: bash
        run: |
          python tools/gitch/tests/test_scip.py
          python tools/gitch/tests/test_watch.py

      # 정적 검사(경고 이상) — 맥 작업과 같은 검사를 Windows 줄 끝·경로로 한 번 더
      - name: shellcheck
        if: ${{ !cancelled() && matrix.shard == 1 }}
        shell: bash
        run: |
          command -v shellcheck >/dev/null || choco install shellcheck -y --no-progress
          shellcheck -S warning tools/check-versions.sh tools/gitch/gitch tools/gitch/install.sh tools/gitch/tests/*.sh

  # 릴리스에 파일을 올려야 해서 쓰기 권한은 태그 실행의 이 작업에만 준다(빌드 작업은 PR 에서도 돈다).
  # 앱의 업데이트 확인은 초안을 보지 않으므로, 관리자가 노트를 쓰고 '게시'해야 사용자에게 간다.
  release:
    name: 릴리스에 올리기
    needs: build
    if: github.ref_type == 'tag'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # 맥(macos.yml 「배포 파일」)과 같은 그룹으로 하나씩 돈다: 먼저 도는 쪽이 초안을 만들고 다음 쪽은 그 초안에 올린다
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gitrochi-windows
          path: dist

      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          # gh release view 는 초안도 태그 이름으로 찾는다(쓰기 권한이 있는 토큰)
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --verify-tag --title "Gitrochi ${tag#v}" --notes ""
          gh release upload "$tag" dist/* --clobber
          {
            echo "### Windows 배포 파일 → $tag"
            echo '```'
            cat dist/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
