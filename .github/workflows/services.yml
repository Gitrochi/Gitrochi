name: Index and services

# The repository index (Rust, crates/gitrochi-index) with its C++ tokenizer (native/), the session
# ledger (crates/gitrochi-ledger) and its auto-continue policy (crates/gitrochi-autocontinue), the
# Python tools on top of the index (tools/gitrochi-py) and the Go hub and monitor (services/hub),
# each on the systems it ships to. The apps' own workflows build the index into the apps.
on:
  pull_request:
    paths: ["crates/**", "native/**", "tools/gitrochi-py/**", "services/**", "tools/generate-core-notices.py", "THIRD_PARTY_NOTICES.md", ".github/workflows/services.yml"]
  workflow_dispatch:

concurrency:
  group: services-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  index:
    name: Index and tokenizer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates -> target"

      - name: Format and static checks
        run: |
          cargo fmt --all --manifest-path crates/Cargo.toml -- --check
          cargo clippy --locked --manifest-path crates/Cargo.toml --all-targets -- -D warnings

      # SQLite and the C++ tokenizer compile through the cc crate: clang, gcc or MSVC.
      - name: Index tests
        run: cargo test --locked --manifest-path crates/Cargo.toml -p gitrochi-index

      - name: C++ module on its own (tests, runtime-free check, loadable extension)
        if: runner.os != 'Windows'
        run: |
          # The SQLite headers the Rust build already downloaded (sqlite3ext.h included).
          header="$(find ~/.cargo/registry/src -path '*libsqlite3-sys-*/sqlite3/sqlite3ext.h' | head -1)"
          SQLITE_INCLUDE="$(dirname "$header")" bash native/build.sh --extension

      - name: Dependency notices match the lockfile
        if: runner.os == 'Linux'
        run: python3 tools/generate-core-notices.py --check

  # Apart from the index job, so the ledger's results never change the index checks.
  ledger:
    name: Ledger (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates -> target"

      # Git without a console window and the database under %APPDATA% are Windows-only code paths.
      # --nocapture keeps the large demo's timings and a skipped C/C++ header check in the log.
      - name: Ledger and auto-continue tests
        run: cargo test --locked --manifest-path crates/Cargo.toml -p gitrochi-ledger -p gitrochi-autocontinue -- --nocapture

  python:
    name: Python tools (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is macOS's system python3, which the shipped tools must keep working with
          # (Ubuntu 26.04 runners no longer offer it).
          - {os: macos-26, python: "3.9"}
          - {os: macos-26, python: "3.13"}
          - {os: ubuntu-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates -> target"

      - name: Build the index the tools read
        run: cargo build --locked --release --manifest-path crates/Cargo.toml --bin gitrochi-index

      - name: Unit and integration tests
        env:
          GITROCHI_INDEX_BIN: ${{ github.workspace }}/crates/target/release/gitrochi-index
        run: |
          python -m compileall -q tools/gitrochi-py/gitrochi
          python -m unittest discover -s tools/gitrochi-py/tests -v

  go:
    name: Go hub and monitor (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: services/hub
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/hub/go.mod
          cache: false

      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...

      - name: Tests (race detector where cgo is available)
        run: |
          if [ "$RUNNER_OS" = Windows ]; then go test ./...; else go test -race ./...; fi

      - name: Static binaries for every target
        if: runner.os == 'Linux'
        run: bash build.sh --all

  integration:
    name: End to end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-26, python: "3.9"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates -> target"

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/hub/go.mod
          cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # The index, the Python supervisor and review, and the Go hub and monitors together.
      - name: Index, Python tools and Go services on throwaway repositories
        run: bash tools/test-index-integration.sh
